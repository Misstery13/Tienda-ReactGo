# Solo para DESARROLLO local: base de datos y caché.
# El despliegue completo (frontend, API, SaaS y túnel) está en el
# docker-compose.yml de la raíz del proyecto.
#
# Los nombres y puertos difieren del de producción para que ambos
# puedan convivir en la misma máquina sin chocar.

services:
  postgres:
    image: postgres:16
    container_name: multicatalogo-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-multicatalogo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-multicatalogo}
      POSTGRES_DB: ${DB_NAME:-multicatalogo}
    ports:
      # 5433 en el host para no chocar con otro PostgreSQL ya instalado.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ./database:/docker-entrypoint-initdb.d:ro
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-multicatalogo} -d ${DB_NAME:-multicatalogo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: multicatalogo-cache-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_dev:
