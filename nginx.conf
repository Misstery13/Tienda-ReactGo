# Proxy inverso: un solo origen para el navegador.
# Al servir frontend y API bajo el mismo dominio, CORS deja de existir.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los archivos estáticos.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El DNS interno de Docker se consulta en cada petición, no al arrancar.
    # Así nginx levanta aunque un servicio todavía no esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La capa SaaS (FastAPI) va primero: su prefijo es más específico.
    location /api/saas/ {
        set $destino_saas http://saas:8000;
        proxy_pass $destino_saas;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El resto de /api va al núcleo transaccional (Go/Fiber).
    location /api/ {
        set $destino_api http://backend:3000;
        proxy_pass $destino_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los archivos con hash en el nombre no cambian: se cachean largo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PWA: el service worker y el manifest nunca se cachean en el navegador,
    # para que cada despliegue llegue a quien ya tiene la app instalada.
    location ~ ^/(sw\.js|registerSW\.js|workbox-.*\.js)$ {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida la resuelve React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
